<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>❤️ Heart Disease Prediction</h1>

    <p class="subtitle">
        End-to-End Machine Learning Model Deployment using Flask & Render
    </p>

    <form action="/predict" method="POST">

        <div class="row">

            <div class="input-group">
                <label>Age</label>
                <input type="number" name="age" required>
            </div>

            <div class="input-group">
                <label>Sex (1 = Male, 0 = Female)</label>
                <input type="number" name="sex" min="0" max="1" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Chest Pain Type (cp)</label>
                <input type="number" name="cp" required>
            </div>

            <div class="input-group">
                <label>Resting Blood Pressure</label>
                <input type="number" name="trestbps" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Cholesterol</label>
                <input type="number" name="chol" required>
            </div>

            <div class="input-group">
                <label>Fasting Blood Sugar</label>
                <input type="number" name="fbs" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Rest ECG</label>
                <input type="number" name="restecg" required>
            </div>

            <div class="input-group">
                <label>Maximum Heart Rate</label>
                <input type="number" name="thalach" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Exercise Induced Angina</label>
                <input type="number" name="exang" required>
            </div>

            <div class="input-group">
                <label>Old Peak</label>
                <input type="number" step="0.1" name="oldpeak" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group">
                <label>Slope</label>
                <input type="number" name="slope" required>
            </div>

            <div class="input-group">
                <label>Number of Major Vessels (ca)</label>
                <input type="number" name="ca" required>
            </div>

        </div>

        <div class="row">

            <div class="input-group full">

                <label>Thal</label>

                <input type="number" name="thal" required>

            </div>

        </div>

        <button type="submit">

            Predict Heart Disease

        </button>

    </form>

    {% if prediction_text %}

    <div class="result">

        <h2 style="color:{{ prediction_color }};">

            {{ prediction_text }}

        </h2>

    </div>

    {% endif %}

    <div class="footer">

        <p>

            AI-ML Final Project • Flask • Random Forest • Render Deployment

        </p>

    </div>

</div>

</body>

</html>
